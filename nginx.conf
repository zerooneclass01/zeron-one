# nginx.conf
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Direciona logs para o console do Google Cloud
    access_log /dev/stdout;
    error_log /dev/stderr;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 8080; # Porta obrigatória para o Cloud Run
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Suporte para roteamento do Angular (Single Page Application)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Configurações de Cache (como você já tinha feito muito bem)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires 0;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Página de erro
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}