server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Tenta servir o arquivo, se não achar, manda para o index.html (SPA routing)
        try_files $uri $uri/ /index.html;
    }

    # Opcional: Ajuste para lidar com o cache de arquivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}