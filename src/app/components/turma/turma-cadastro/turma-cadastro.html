<p>turma-cadastro works!</p>
<div class="modal-overlay" (click)="aoFechar.emit()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    
    <div class="modal-header">
      <h2>Nova Turma</h2>
      <button class="btn-close" (click)="aoFechar.emit()">&times;</button>
    </div>

    <!-- Nome da Turma -->
    <div class="form-group">
      <label [style.color]="!turma.nome ? '#888' : '#fff'">Nome da Turma *</label>
      <input 
        type="text" 
        [(ngModel)]="turma.nome" 
        placeholder="Ex: Muay Thai Noite"
        [style.border-color]="!turma.nome ? '#444' : '#28a745'">
    </div>

    <!-- Horário -->
    <div class="form-row">
      <div class="form-group">
        <label>Horário</label>
        <input type="time" [(ngModel)]="turma.horario">
      </div>
    </div>

    <!-- Dias da Semana (Chips Horizontais) -->
    <div class="form-group">
      <label [style.color]="turma.diasDaSemana === 0 ? '#888' : '#28a745'">
        Dias da Semana * {{ turma.diasDaSemana === 0 ? '(Selecione ao menos um)' : '✓' }}
      </label>
      <div class="dias-container">
        <div *ngFor="let dia of diasOpcoes" 
             class="dia-chip" 
             [class.active]="diasSelecionados[dia.valor]"
             (click)="selecionarDia(dia.valor)">
          {{ dia.nome }}
        </div>
      </div>
    </div>

    <!-- Seleção de Professor -->
    <div class="form-group">
      <label [style.color]="!turma.professorId ? '#e50914' : '#28a745'">
        Professor * {{ !turma.professorId ? '(Obrigatório)' : '✓' }}
      </label>
      <select 
        [(ngModel)]="turma.professorId"
        [style.border-color]="!turma.professorId ? '#e50914' : '#28a745'">
        <option [ngValue]="null" disabled selected>Selecione um professor...</option>
        <option *ngFor="let prof of professores" [ngValue]="prof.id">
          {{ prof.nome }}
        </option>
      </select>
    </div>

    <!-- Ações -->
    <div class="modal-actions">
      <button class="btn-cancel" (click)="aoFechar.emit()">Cancelar</button>
      
      <button 
        class="btn-save" 
        (click)="salvar()" 
        [disabled]="!turma.nome || !turma.professorId || turma.diasDaSemana === 0"
        [style.opacity]="(!turma.nome || !turma.professorId || turma.diasDaSemana === 0) ? '0.5' : '1'"
        [style.cursor]="(!turma.nome || !turma.professorId || turma.diasDaSemana === 0) ? 'not-allowed' : 'pointer'">
        Criar Turma
      </button>
    </div>

  </div>
</div>
