<div class="container mt-4">
  <div *ngIf="mensagem" class="alert alert-{{tipoMensagem}} mb-3">
    {{ mensagem }}
  </div>

  <div class="card bg-dark text-white border-secondary shadow">
    <div class="card-header border-secondary">
      <h3 class="h5 mb-0"><i class="fas fa-user-edit me-2"></i>Atualizar Aluno</h3>
    </div>
    
    <div class="card-body">
      <form (ngSubmit)="atualizar()">
        
        <div class="mb-3">
          <label class="form-label text-secondary small">Nome Completo</label>
          <input type="text" [(ngModel)]="alunoEdicao.nome" name="nome" 
                 class="form-control bg-black text-white border-secondary" required>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label text-secondary small">Data de Nascimento</label>
            <input type="date" [(ngModel)]="alunoEdicao.dataNascimento" name="dataNascimento" 
                   class="form-control bg-black text-white border-secondary">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label text-secondary small">Telefone</label>
            <input type="text" [(ngModel)]="alunoEdicao.telefone" name="telefone" 
                   class="form-control bg-black text-white border-secondary" placeholder="Ex: 11999999999">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label text-secondary small">E-mail</label>
          <input type="email" [(ngModel)]="alunoEdicao.email" name="email" 
                 class="form-control bg-black text-white border-secondary">
        </div>

        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-outline-light" (click)="cancelar()">Cancelar</button>
          <button type="submit" class="btn btn-primary px-4">Salvar Alterações</button>
        </div>
      </form>
    </div>
  </div>
</div>
