<div class="perfil-container">
  <header class="header-section">
    <button class="btn-voltar-link" (click)="voltar()">
      <i class="fas fa-chevron-left"></i> Voltar
    </button>

    <div class="header-content mt-3">
      <div class="title-group">
        <h1 class="display-title">Usuários</h1>
        <p class="text-secondary mb-0">Gerencie acessos e permissões da equipe</p>
      </div>
      
      <div class="header-actions">
        <button class="btn-reset-global" (click)="prepararResetProprio()" title="Alterar Minha Senha">
          <i class="fas fa-key"></i>
        </button>

        @if(podeCadastrar()){
        <button class="btn-zero-red" (click)="abrirModalCadastro()">
          <i class="fas fa-user-plus me-2"></i> <span>Novo Usuário</span>
        </button>
        }
      </div>
    </div>
  </header>

  <div class="search-area mt-4">
    <div class="search-input-group">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Buscar por nome ou nível..." (input)="filtrar($event)">
    </div>
  </div>

  <div class="users-wrapper mt-4">
    <div *ngFor="let user of listaUsuarios()" class="user-card-row">
      <div class="user-main">
        <div class="avatar-red-glow">
          {{ user.username.substring(0,1).toUpperCase() }}
        </div>
        <div class="user-info">
          <h5 class="user-name">{{ user.username }}</h5>
          <div class="user-meta">
            <span class="role-text">{{ user.role }}</span>
            <span class="divider">•</span>
            <span class="id-text">ID: {{ user.id.substring(0,6) }}</span>
          </div>
        </div>
      </div>

      <div class="user-actions">
        <span class="status-pill">Ativo</span>
        <i class="fas fa-chevron-right arrow-icon"></i>
      </div>
    </div>
  </div>
</div>

<dialog id="modalUsuario" class="modal-container">
  <div class="modal-content">
    <h2>Cadastrar Usuário</h2>
    
    <input [(ngModel)]="usuarioRequest().username" placeholder="Username">
    <input [(ngModel)]="usuarioRequest().senha" type="password" placeholder="Senha">
    
    <select [(ngModel)]="usuarioRequest().role">
      <option [value]="0">Admin</option>
      <option [value]="3">Professor</option>
      <option [value]="2">Recepção</option>
      <option [value]="1">RH</option>
    </select>

    <div class="modal-actions">
      <button (click)="fecharModal()">Cancelar</button>
      <button (click)="salvarUsuario()" class="btn-zero-red">Salvar</button>
    </div>
  </div>
</dialog>
