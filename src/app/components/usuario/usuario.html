<div class="perfil-container">
  <header class="header">
    <button class="btn-voltar" (click)="voltar()">
      <i class="fas fa-arrow-left me-2"></i> Voltar
    </button>
    <div class="d-flex justify-content-between align-items-center mt-3">
      <h1>Gestão de Usuários</h1>
      <button class="btn-primary-red w-auto px-4" (click)="abrirModalCadastro()">
        <i class="fas fa-user-plus me-2"></i> Novo Usuário
      </button>
    </div>
  </header>

  <div class="card-dark mt-4">
    <div class="table-responsive">
      <table class="table table-dark table-hover mb-0">
        <thead>
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Nível</th>
            <th class="text-center">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of listaUsuarios">
            <td>{{ user.username }}</td>
            <td>
              <span class="badge" [ngClass]="{
                'bg-danger': user.role === 'Admin',
                'bg-info': user.role === 'RH',
                'bg-warning text-dark': user.role === 'Recepcao',
                'bg-success': user.role === 'Professor'
              }">
                {{ user.role }}
              </span>
            </td>
            <td class="text-center">
              <button class="btn-action-key" title="Resetar Senha" (click)="resetarSenha(user)">
                <i class="fas fa-key"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
